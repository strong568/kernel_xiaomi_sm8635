name: strong568 Theettam ksu manager — build all flavors

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        type: string
        default: "17"
      release:
        description: "Publish a PreRelease with zips & latest managers"
        type: boolean
        default: true
      apatch_superkey:
        description: "APatch superkey (leave empty to skip the APatch flavor)"
        required: false
        default: ""

concurrency:
  group: theettam-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write
  actions: read

env:
  KBUILD_BUILD_USER: build
  KBUILD_BUILD_HOST: localhost
  NEUTRON_BUILD: "30062026"
  NEUTRON_SHA256: b473a420d693a4e3bc71b56ec4283c0e3738f87d6ac37fa202bb0be5e0a07521
  ANTMAN_COMMIT: 0b32c45e3ad83a953b4bc3fd2feb4ad3cc87c1e8
  ANTMAN_SHA256: deef2dcf11568403c712432ecb7678ef62c3244054ccfee8510ef94a8a8fb04d

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.m.outputs.flavors }}
      theettam_version: ${{ steps.ver.outputs.theettam_version }}
    steps:
      - name: Generate dynamic THEETTAM_VERSION
        id: ver
        run: |
          DATE_NOW=$(date -u +'%Y%m%d')
          echo "theettam_version=${DATE_NOW}-strong568" >> "$GITHUB_OUTPUT"

      - id: m
        env:
          APATCH_SUPERKEY: ${{ inputs.apatch_superkey }}
        run: |
          F='"plain","ksun-plain","ksun-susfs","sukisu-susfs","ksun-susfs-droidspaces","resukisu-susfs","premium"'
          if [ -n "$APATCH_SUPERKEY" ]; then F="$F,\"apatch\""; else echo "::notice::APatch flavor skipped (no superkey supplied)"; fi
          echo "flavors=[$F]" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    name: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex build-essential \
            libssl-dev libncurses-dev libelf-dev zlib1g-dev pkg-config git curl zip cpio \
            kmod python3 ccache lld llvm dwarves zstd jq wget

      - name: Auto-update Upstreams (SuSFS, KSUN, SukiSU, ReSukiSU)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_FILE=$(find . -name "pins.env" | head -n 1)
          if [ -z "$TARGET_FILE" ] || [ ! -f "$TARGET_FILE" ]; then
            echo "::error::Không tìm thấy file pins.env!"
            exit 1
          fi

          echo "=========================================="
          echo "[*] Updating pins.env ($TARGET_FILE)"

          # 1. SuSFS (Lấy SHA commit mới nhất qua git ls-remote từ GitLab)
          LATEST_SUSFS_PIN=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1 | awk '{print $1}')
          if [ -n "$LATEST_SUSFS_PIN" ]; then
            echo "-> SuSFS latest commit: $LATEST_SUSFS_PIN"
            sed -i "s|^SUSFS_PIN=.*|SUSFS_PIN=$LATEST_SUSFS_PIN|" "$TARGET_FILE"
          fi

          # 2. KernelSU-Next (Tag mới nhất)
          KSUN_TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | jq -r '.[0].name // empty')
          if [ -n "$KSUN_TAG" ] && [ "$KSUN_TAG" != "null" ]; then
            echo "-> KSUN latest tag: $KSUN_TAG"
            sed -i "s|^KSUN_TAG=.*|KSUN_TAG=$KSUN_TAG|" "$TARGET_FILE"
          fi

          # 3. SukiSU-Ultra (SHA commit mới nhất nhánh main)
          SUKISU_PIN=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/main" | jq -r '.sha // empty')
          if [ -n "$SUKISU_PIN" ] && [ "$SUKISU_PIN" != "null" ]; then
            echo "-> SukiSU latest commit: $SUKISU_PIN"
            sed -i "s|^SUKISU_PIN=.*|SUKISU_PIN=$SUKISU_PIN|" "$TARGET_FILE"
            sed -i 's|^SUKISU_MAIN_CHERRYPICKS=.*|SUKISU_MAIN_CHERRYPICKS=""|' "$TARGET_FILE"
          fi

          # 4. ReSukiSU (SHA commit mới nhất nhánh main)
          RESUKISU_PIN=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/ReSukiSU/ReSukiSU/commits/main" | jq -r '.sha // empty')
          if [ -n "$RESUKISU_PIN" ] && [ "$RESUKISU_PIN" != "null" ]; then
            echo "-> ReSukiSU latest commit: $RESUKISU_PIN"
            sed -i "s|^RESUKISU_PIN=.*|RESUKISU_PIN=$RESUKISU_PIN|" "$TARGET_FILE"
          fi

          echo "=========================================="
          echo "[*] Current pinned versions in pins.env:"
          grep -E "^(SUSFS_PIN|KSUN_TAG|SUKISU_PIN|RESUKISU_PIN)=" "$TARGET_FILE"
          echo "=========================================="


      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.flavor }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.flavor }}-

      - name: Neutron clang ${{ env.NEUTRON_BUILD }} (pinned, checksummed)
        run: |
          set -euo pipefail
          rm -rf "$HOME/clang"; mkdir -p "$HOME/clang"; cd "$HOME/clang"
          curl -fsSLO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${NEUTRON_BUILD}/neutron-clang-${NEUTRON_BUILD}.tar.zst"
          echo "${NEUTRON_SHA256}  neutron-clang-${NEUTRON_BUILD}.tar.zst" | sha256sum -c
          tar -I zstd -xf "neutron-clang-${NEUTRON_BUILD}.tar.zst" && rm -f "neutron-clang-${NEUTRON_BUILD}.tar.zst"
          curl -fsSLo antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/${ANTMAN_COMMIT}/antman"
          echo "${ANTMAN_SHA256}  antman" | sha256sum -c
          chmod +x antman
          for i in 1 2 3 4; do
            ./antman --patch=glibc && break
            [ "$i" = 4 ] && { echo "::error::antman --patch=glibc failed 4 times"; exit 1; }
            echo "antman attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
          done
          ./bin/clang --version | head -1

      - name: Build ${{ matrix.flavor }} (scripts/ci/build-flavor.sh)
        env:
          ZIP_VERSION: ${{ needs.plan.outputs.theettam_version }}
          APATCH_SUPERKEY: ${{ inputs.apatch_superkey }}
          KMI_STRICT: "1"
          SKIP_ZIP: ${{ matrix.flavor == 'plain' && '1' || '0' }}
        run: |
          set -euo pipefail
          export CLANG_DIR="$HOME/clang"
          scripts/ci/build-flavor.sh "${{ matrix.flavor }}"

      - uses: actions/upload-artifact@v4
        if: matrix.flavor != 'plain'
        with:
          name: zip-${{ matrix.flavor }}
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.flavor }}
          path: |
            dist/Image-*
            dist/Module.symvers-*
            dist/config-*
            out/build.log
            out/kmi-diff.txt
          if-no-files-found: ignore

  fetch_managers:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    name: "Fetch Latest Manager APKs"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "🔍 Fetch Latest Manager APKs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk_output
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "Baka-SU/BakaSU"
            "SukiSU-Ultra/SukiSU-Ultra"
            "backslashxx/KernelSU"
            "KernelSU-Next/KernelSU-Next"
            "midori01/KernelSU"
          )

          COUNT=0
          for repo in "${REPOS[@]}"; do
            echo "========================================"
            echo "[*] Processing Release: $repo"
            OWNER="${repo%%/*}"
            
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            if [[ "$repo" == "Baka-SU/BakaSU" ]]; then
              BAKA_REL_URL=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty')
              BAKA_REL_NAME=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .name // empty')
              RESUKI_REL_URL=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty')
              RESUKI_REL_NAME=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .name // empty')

              if [ -n "$BAKA_REL_URL" ]; then
                curl -fLSs -o "apk_output/Release_BakaSU_${BAKA_REL_NAME}" "$BAKA_REL_URL"
                COUNT=$((COUNT + 1))
              fi
              if [ -n "$RESUKI_REL_URL" ]; then
                curl -fLSs -o "apk_output/Release_ReSukiSU_${RESUKI_REL_NAME}" "$RESUKI_REL_URL"
                COUNT=$((COUNT + 1))
              fi
              continue
            fi

            ASSET_INFO=$(echo "$DATA" | jq -r '
              [ .[] | {
                  tag: .tag_name, 
                  asset: (
                    (.assets[]? | select(.name | test("arm64-v8a.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("universal.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("\\.apk$"; "i")))
                  )
                } 
              ] | map(select(.asset != null)) | first // empty
            ')

            APK_URL=$(echo "$ASSET_INFO" | jq -r '.asset.browser_download_url // empty')
            RAW_FILE_NAME=$(echo "$ASSET_INFO" | jq -r '.asset.name // empty')
            VERSION_TAG=$(echo "$ASSET_INFO" | jq -r '.tag // empty')

            if [ -n "$APK_URL" ]; then
              if [[ "$repo" == "SukiSU-Ultra/SukiSU-Ultra" ]]; then
                FILE_NAME="Release_SukiSU_${RAW_FILE_NAME}"
              elif [[ "$repo" == "KernelSU-Next/KernelSU-Next" ]]; then
                FILE_NAME="KernelSU_Next_Manager_${VERSION_TAG}.apk"
              elif [[ "$repo" == "midori01/KernelSU" ]]; then
                FILE_NAME="Release_midori01_${RAW_FILE_NAME}"
              else
                FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              fi
              curl -fLSs -o "apk_output/$FILE_NAME" "$APK_URL" || wget -q -O "apk_output/$FILE_NAME" "$APK_URL"
              [ -s "apk_output/$FILE_NAME" ] && COUNT=$((COUNT + 1))
            fi
          done

          echo "========================================"
          echo "[*] Fetching Actions Runs from Baka-SU/BakaSU..."
          BAKA_RUNS_JSON=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs?status=completed&conclusion=success&per_page=30")

          BAKASU_PR_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select(((.event == "pull_request") or (.head_branch | test("pr|pull"; "i"))) and (.name | test("build.*manager|manager|ci"; "i"))) ] | first | .id // empty')
          RESUKISU_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select((.head_branch | test("resuki"; "i")) and (.name | test("build.*manager|manager|ci"; "i"))) ] | first | .id // empty')
          BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select((.event != "pull_request") and (.head_branch | test("main|master"; "i")) and (.name | test("build.*manager|manager|ci"; "i"))) ] | first | .id // empty')

          fetch_bakasu_action() {
            local R_ID="$1"
            local PREFIX="$2"
            [ -z "$R_ID" ] && return 0
            local ART_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs/${R_ID}/artifacts")
            echo "$ART_JSON" | jq -c '.artifacts[]? | select(.name | test("manager|apk"; "i"))' | while read -r art; do
              local ART_NAME=$(echo "$art" | jq -r '.name')
              local ART_URL=$(echo "$art" | jq -r '.archive_download_url')
              curl -fLSs -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "temp_${PREFIX}_${ART_NAME}.zip" "$ART_URL"
              if [ -s "temp_${PREFIX}_${ART_NAME}.zip" ]; then
                mkdir -p "ext_${PREFIX}_${ART_NAME}"
                unzip -q -o "temp_${PREFIX}_${ART_NAME}.zip" -d "ext_${PREFIX}_${ART_NAME}/"
                local CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -iE "arm64-v8a.*release|arm64.*release" | head -n 1)
                [ -z "$CHOSEN_APK" ] && CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                if [ -n "$CHOSEN_APK" ]; then
                  local RAW_NAME=$(basename "$CHOSEN_APK")
                  cp "$CHOSEN_APK" "apk_output/${PREFIX}_${RAW_NAME}"
                fi
                rm -rf "temp_${PREFIX}_${ART_NAME}.zip" "ext_${PREFIX}_${ART_NAME}"
              fi
            done
          }
          fetch_bakasu_action "$BAKASU_MAIN_RUN_ID" "Action_BakaSU"
          fetch_bakasu_action "$BAKASU_PR_RUN_ID"   "Action_BakaSU_PR"
          fetch_bakasu_action "$RESUKISU_RUN_ID"    "Action_ReSukiSU"

          echo "========================================"
          echo "[*] Fetching latest artifact from SukiSU-Ultra..."
          SUKI_RUN_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=completed&conclusion=success&per_page=5" | jq -r '([ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first) // .workflow_runs[0].id // empty')
          if [ -n "$SUKI_RUN_ID" ]; then
            SUKI_DL_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/${SUKI_RUN_ID}/artifacts" | jq -r '[ .artifacts[] | select(.name | test("manager|apk|sukisu"; "i")) ] | first | .archive_download_url // empty')
            if [ -n "$SUKI_DL_URL" ]; then
              curl -fLSs -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "sukisu_temp.zip" "$SUKI_DL_URL"
              if [ -s "sukisu_temp.zip" ]; then
                mkdir -p sukisu_extracted
                unzip -q -o "sukisu_temp.zip" -d sukisu_extracted/
                FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | grep -iE "arm64-v8a|arm64" | head -n 1)
                [ -z "$FOUND_SUKI_APK" ] && FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | head -n 1)
                [ -n "$FOUND_SUKI_APK" ] && cp "$FOUND_SUKI_APK" "apk_output/Action_SukiSU_$(basename "$FOUND_SUKI_APK")"
                rm -rf sukisu_temp.zip sukisu_extracted
              fi
            fi
          fi

          echo "========================================"
          echo "[*] Fetching latest artifact from midori01/KernelSU..."
          MIDORI_RUN_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midori01/KernelSU/actions/runs?status=completed&conclusion=success&per_page=10" | jq -r '([ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first) // .workflow_runs[0].id // empty')
          if [ -n "$MIDORI_RUN_ID" ]; then
            MIDORI_DL_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midori01/KernelSU/actions/runs/${MIDORI_RUN_ID}/artifacts" | jq -r '[ .artifacts[] | select(.name | test("manager|apk|ksu"; "i")) ] | first | .archive_download_url // empty')
            if [ -n "$MIDORI_DL_URL" ]; then
              curl -fLSs -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "midori_temp.zip" "$MIDORI_DL_URL"
              if [ -s "midori_temp.zip" ]; then
                mkdir -p midori_extracted
                unzip -q -o "midori_temp.zip" -d midori_extracted/
                FOUND_MIDORI_APK=$(find midori_extracted -type f -name "*.apk" | grep -iE "arm64-v8a|arm64" | head -n 1)
                [ -z "$FOUND_MIDORI_APK" ] && FOUND_MIDORI_APK=$(find midori_extracted -type f -name "*.apk" | head -n 1)
                [ -n "$FOUND_MIDORI_APK" ] && cp "$FOUND_MIDORI_APK" "apk_output/Action_midori01_$(basename "$FOUND_MIDORI_APK")"
                rm -rf midori_temp.zip midori_extracted
              fi
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: all-ksu-managers
          path: apk_output/*.apk
          if-no-files-found: ignore

  release:
    needs: [plan, build, fetch_managers]
    if: success() && github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: release_files
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: all-ksu-managers
          path: release_files
        continue-on-error: true

      - run: ls -lh release_files/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ needs.plan.outputs.theettam_version }}-${{ github.run_number }}-${{ inputs.branch }}
          prerelease: true
          make_latest: false
          name: ${{ needs.plan.outputs.theettam_version }} CI build #${{ github.run_number }} (compile-verified, untested)
          body: |
            > [!IMPORTANT]
            > **CI test build, not a release. Most people want the latest published release** —
            > those are boot-tested. This is compile-verified and KMI-gated only.

            Built from branch `${{ inputs.branch }}` @ `${{ github.sha }}` with Neutron clang ${{ env.NEUTRON_BUILD }}.
            Flash only if you mean to test this build, with a backup and fastboot recovery ready.

            ### 📦 Manager APKs Included (ARM64)
            - **Official:** `tiann/KernelSU`
            - **Rissu / SuSFS:** `rsuntk/KernelSU`
            - **BakaSU / ReSukiSU:** `Baka-SU/BakaSU` (Releases & CI Runs)
            - **SukiSU-Ultra:** `SukiSU-Ultra/SukiSU-Ultra`
            - **KernelSU-Next:** `KernelSU-Next/KernelSU-Next`
            - **Midori01:** `midori01/KernelSU`
          files: release_files/*
